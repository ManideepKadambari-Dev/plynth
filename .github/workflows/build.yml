name: build

on:
  push:
  workflow_dispatch:
    inputs:
      config:
        description: gate builds and tests Debug and Release. debug builds and tests Debug only.
        type: choice
        options: [gate, debug]
        default: gate
      tests:
        description: Run only the tests whose names match this CTest pattern. Empty runs every test.
        type: string
        default: ''

permissions:
  contents: read

# A branch push and a gate on the same branch do not cancel each other.
concurrency:
  group: build-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.config != 'debug')) && 'gate' || 'debug' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
  VCPKG_DISABLE_METRICS: 1
  QT_QPA_PLATFORM: offscreen

jobs:
  windows:
    name: >-
      ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.config != 'debug'))
      && (format('{0}', inputs.tests) != '' && 'Debug and Release, filtered, not a gate' || 'Release gate')
      || (format('{0}', inputs.tests) != '' && 'Debug only, filtered' || 'Debug only') }}
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PLYNTH_GATE: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.config != 'debug')) && 'true' || 'false' }}
      PACKAGE_CONFIG: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.config != 'debug')) && 'Release' || 'Debug' }}
      TEST_FILTER: ${{ inputs.tests }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtquick3d qtshadertools qtquicktimeline qtimageformats
          cache: true

      - name: Point the presets at Qt
        shell: pwsh
        run: |
          "QTDIR=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Load the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare vcpkg
        shell: pwsh
        run: |
          # Loading MSVC points VCPKG_ROOT at Visual Studio's copy, which cannot be bootstrapped.
          $env:VCPKG_ROOT = 'C:\vcpkg'
          "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The manifest baseline needs the full vcpkg history.
          if ((git -C $env:VCPKG_ROOT rev-parse --is-shallow-repository) -eq 'true') {
            git -C $env:VCPKG_ROOT fetch --unshallow
          }
          git -C $env:VCPKG_ROOT pull --ff-only
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$env:VCPKG_DEFAULT_BINARY_CACHE,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}-
            vcpkg-${{ runner.os }}-

      - name: Count cached packages
        id: before
        shell: pwsh
        run: |
          $n = (Get-ChildItem -Recurse -File $env:VCPKG_DEFAULT_BINARY_CACHE | Measure-Object).Count
          "count=$n" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Configure
        shell: pwsh
        run: cmake --preset msvc

      - name: Check for new packages
        if: always()
        id: after
        shell: pwsh
        run: |
          $n = (Get-ChildItem -Recurse -File $env:VCPKG_DEFAULT_BINARY_CACHE | Measure-Object).Count
          $changed = if ($n -ne [int]'${{ steps.before.outputs.count }}') { 'true' } else { 'false' }
          "changed=$changed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Save the vcpkg binary cache
        if: always() && steps.after.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}-${{ github.run_id }}

      - name: Describe the run
        shell: pwsh
        run: |
          $lines = if ($env:PLYNTH_GATE -eq 'true') {
            'Release gate: Debug and Release are built and every test outside the blender and gpu labels runs in both.'
          } else {
            'Debug only. Release is not built, so this run is not the Release gate.'
          }
          if ($env:TEST_FILTER) { $lines = @($lines, '', 'Filtered: only tests whose names match the pattern below ran, so this run is not a gate.', '', '```', $env:TEST_FILTER, '```') }
          @($lines) + @('') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Build Debug
        id: build-debug
        shell: pwsh
        run: cmake --build --preset debug

      - name: Test Debug
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE/.github/scripts/run-tests.ps1" -Preset debug -LogFolder "$env:GITHUB_WORKSPACE/test-logs"'

      - name: Build Release
        id: build-release
        if: env.PLYNTH_GATE == 'true' && !cancelled() && steps.build-debug.outcome == 'success'
        shell: pwsh
        run: cmake --build --preset release

      - name: Test Release
        if: env.PLYNTH_GATE == 'true' && !cancelled() && steps.build-release.outcome == 'success'
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE/.github/scripts/run-tests.ps1" -Preset release -LogFolder "$env:GITHUB_WORKSPACE/test-logs"'

      - name: Make the ready to run copy
        id: package
        if: >-
          ${{ !cancelled()
          && ((env.PACKAGE_CONFIG == 'Debug' && steps.build-debug.outcome == 'success')
          || (env.PACKAGE_CONFIG == 'Release' && steps.build-release.outcome == 'success')) }}
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE/.github/scripts/make-package.ps1" -Config $env:PACKAGE_CONFIG -Destination "$env:GITHUB_WORKSPACE/out/package/plynth" -LogFolder "$env:GITHUB_WORKSPACE/test-logs"'

      - name: Upload the ready to run copy
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_CONFIG == 'Release' && 'plynth-windows-release' || 'plynth-windows-debug' }}
          path: out/package/plynth/
          if-no-files-found: error
          retention-days: ${{ env.PLYNTH_GATE == 'true' && 30 || 14 }}

      - name: Upload test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            test-logs/
            out/build/msvc/vcpkg-manifest-install.log
            out/build/msvc/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14
